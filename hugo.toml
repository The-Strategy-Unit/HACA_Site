baseURL = "https://haca-conference.nhs.uk/"
title = "Health and Care Analytics conference"
theme = "HACA_Theme"

[module]
  [[module.mounts]]
    source = "posters/_book"
    target = "static/posters"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "content"
    target = "content"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]

  [[menu.main]]
    identifier = "Home page"
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "HACA 2025 Programme"
    name = "Programme"
    url = "/HACA_Programme"
    weight = 20

  [[menu.main]]
    identifier = "HACA 2025 Keynote Speakers"
    name = "Keynote Speakers"
    url = "/HACA_Keynote_Speakers"
    weight = 30

  [[menu.main]]
    identifier = "Past Conferences"
    name = "Archive"
    url = "/HACA_Past_Conferences"
    weight = 40
      
[params]

# Social media links

  [[params.social]]
    icon = "youtube"
    icon_pack = "fab"
    url = "https://www.youtube.com/@HACA_Conference"

  [[params.social]]
    icon = "github"
    icon_pack = "fab"
    url = "https://github.com/The-Strategy-Unit/HACA_Site"

  [[params.social]]
    icon = "linkedin"
    icon_pack = "fab"
    url = "https://www.linkedin.com/company/haca-live/"

